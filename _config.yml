title: "ebad@research"
tagline: "network security technician // detection engineering // homelab nebula"
description: "Notes from the lab, writeups from HTB, and the occasional argument for why your detection rule is wrong."
url: "https://blog.ebadkhan.dev"
baseurl: ""

author:
  name: Ebad Khan
  github: h1dden30
  linkedin: "" # fill in your LinkedIn handle

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
