title: "ebad@research"
tagline: "network security technician // info & network security"
description: "Everything security related that I find interesting!"
url: "https://blog.ebadkhan.dev"
baseurl: ""

author:
  name: Ebad Khan
  github: h1dden30
  linkedin: ""

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
